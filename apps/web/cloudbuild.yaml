# Cloud Build pipeline for the Moisi landing page (apps/web). No build args
# needed — it's a marketing site with no client-side env config.
#
# Trigger setup (same flow as apps/app/cloudbuild.yaml — see that file):
#   Configuration file: apps/web/cloudbuild.yaml
#   Substitutions: usually none. Override _REGION / _REPO / _SERVICE only if
#   you don't want the defaults below.

substitutions:
  _REGION: europe-west1
  _REPO: moisi
  _SERVICE: moisi-web

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    dir: apps/web
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
