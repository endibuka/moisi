# Cloud Build pipeline for the Moisi MCP server (apps/mcp). Mirror of
# apps/app/cloudbuild.yaml — see that file's header for the trigger setup.
#
# Substitutions to set in the trigger UI:
#   _NEXT_PUBLIC_SUPABASE_URL = https://<project>.supabase.co
#   _REGION  (optional)       = europe-west1
#   _REPO    (optional)       = moisi
#   _SERVICE (optional)       = moisi-mcp

substitutions:
  _REGION: europe-west1
  _REPO: moisi
  _SERVICE: moisi-mcp
  _NEXT_PUBLIC_SUPABASE_URL: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    dir: apps/mcp
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
