# Cloud Build pipeline for the Moisi dashboard (apps/app).
#
# How to use from the UI:
#   1. Cloud Build → Triggers → "Create trigger" → connect this GitHub repo.
#   2. Event: push to branch `^main$`.
#   3. Configuration: Cloud Build configuration file → `apps/app/cloudbuild.yaml`.
#   4. Under "Advanced → Substitution variables", set:
#        _NEXT_PUBLIC_SUPABASE_URL              = https://<project>.supabase.co
#        _NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY  = <publishable key from Supabase API page>
#        _REGION  (optional)                    = europe-west1
#        _REPO    (optional)                    = moisi
#        _SERVICE (optional)                    = moisi-app
#   5. Save. Push to main → Cloud Build builds + deploys automatically.
#
# Or one-shot from the CLI:
#   gcloud builds submit apps/app `
#     --config=apps/app/cloudbuild.yaml `
#     --substitutions=_NEXT_PUBLIC_SUPABASE_URL=...,_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=...
#
# NOTE: this file lives inside apps/app/ but the build context Cloud Build
# uploads is the *repo root* when triggered from GitHub. The `dir:` field on
# each step pins us back to apps/app so docker can see the Dockerfile + code.

substitutions:
  _REGION: europe-west1
  _REPO: moisi
  _SERVICE: moisi-app
  _NEXT_PUBLIC_SUPABASE_URL: ""
  _NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    dir: apps/app
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
